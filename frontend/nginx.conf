server {
    listen 80;
    server_name _;

    # Allow large image uploads (default is 1MB; backend caps at 10MB).
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Built JS/CSS bundles are content-hashed by Vite — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: serve index.html for any unknown frontend route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strip /api prefix and forward to backend.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass /uploads/ through unchanged. Backend already sets Cache-Control: immutable.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
