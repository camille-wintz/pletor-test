services:
  backend:
    build: ./backend
    image: pletor-coding-exercise-backend:prod
    container_name: backend-prod
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/test.db:/app/test.db
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: pletor-coding-exercise-frontend:prod
    container_name: frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
